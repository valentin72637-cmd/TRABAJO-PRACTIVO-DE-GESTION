<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar | SegurAR</title>

  <!-- Bootstrap y fuentes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== FONDO GENERAL ===== */
    body {
      font-family: 'Inter', sans-serif;
      background:
        linear-gradient(rgba(0, 86, 179, 0.75), rgba(0, 86, 179, 0.75)),
        url('./app/assets/fondo-segurar.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== TARJETA DE LOGIN ===== */
    .login-card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      background-color: #fff;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* ===== CABECERA CON LOGO ===== */
    .login-header {
      background: linear-gradient(90deg, #0056b3, #0d6efd);
      color: white;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }

    .login-header img {
      width: 70px;
      height: auto;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    .login-header h1 {
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .login-header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* ===== FORMULARIO ===== */
    .form-control, .btn {
      border-radius: 0.6rem;
    }

    .btn-primary {
      background: #0d6efd;
      border: none;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-primary:hover {
      background: #0b5ed7;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      color: #ffffffd0;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #togglePwd {
      border-color: #ced4da;
      color: #6c757d;
    }

    #togglePwd:hover {
      background-color: #e9ecef;
    }

    .small code {
      background-color: #e7f1ff;
      color: #0d6efd;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <main class="container text-center">
    <div class="d-flex justify-content-center align-items-center">
      <div class="login-card">

        <!-- CABECERA CON LOGO -->
        <div class="login-header">
          <img src="./app/assets/logo.png" class="img-fluid mb-3" alt="Logo SegurAR">
          <h1 class="h4 mb-0">SegurAR</h1>
          <p>Sistema de Gestión de Seguros</p>
        </div>

        <!-- FORMULARIO -->
        <div class="card-body p-4">
          <p class="text-center text-muted mb-3">Accedé con tu cuenta</p>

          <!-- ⚠️ CONTENEDOR DE ALERTAS (AGREGADO) -->
          <div id="alert-container" class="mb-3"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3 text-start">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required />
              <div class="invalid-feedback">Ingresá un correo válido.</div>
            </div>

            <div class="mb-3 text-start">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" required minlength="8" />
                <button type="button" class="btn" id="togglePwd" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
            </div>

            <div class="d-grid mt-4">
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
              </button>
            </div>
          </form>

          <hr class="my-4">
          <p class="small text-muted text-start">
            Solicitá tus credenciales al administrador.


          </p>
        </div>
      </div>
    </div>

    <footer class="mt-4">
      © 2026 SegurAR — Proyecto Académico U.T.N. F.R.T.
    </footer>
  </main>

  <!-- SCRIPT FUNCIONAL DEL BOTÓN OJO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const togglePwd = document.getElementById("togglePwd");
      const pwd = document.getElementById("password");
      const icon = togglePwd?.querySelector("i");

      if (togglePwd && pwd && icon) {
        togglePwd.addEventListener("click", (e) => {
          e.preventDefault(); // evita reiniciar el form
          
          if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
          } else {
            pwd.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
          }
        });
      }
    });
  </script>

  <script src="app/common.js"></script>
  <script src="app/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
